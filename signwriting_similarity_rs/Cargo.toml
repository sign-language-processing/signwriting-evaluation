[package]
name = "signwriting_similarity_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "signwriting_similarity_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
rustc-hash = "2"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
