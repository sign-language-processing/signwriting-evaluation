name: Test


on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Requirements
        run: pip install .[dev]  # maturin build backend compiles the Rust kernel into the package

      - name: Test Code
        run: pytest signwriting_evaluation
