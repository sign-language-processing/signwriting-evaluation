name: Test


on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Requirements
        # editable so maturin places the compiled kernel in the source tree (which shadows site-packages
        # when pytest runs from the repo root); a plain install would hide the .so behind the source dir
        run: pip install -e .[dev]

      - name: Test Code
        run: pytest signwriting_evaluation
