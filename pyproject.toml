[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "signwriting-evaluation"
description = "Automatic Evaluation for SignWriting Machine Learning Outputs"
version = "0.0.1"
authors = [
    { name = "Amit Moryossef", email = "amitmoryossef@gmail.com" }
]
readme = "README.md"
dependencies = [
    # Core: FSW parsing, normalization, mirroring, and rendering — needed by every metric.
    "signwriting>=0.1.9",
]

[project.optional-dependencies]
# Per-metric extras: install only what you use, e.g. `pip install signwriting-evaluation[similarity]`.
bleu = ["sacrebleu"]
chrf = ["sacrebleu"]
similarity = ["numpy", "scipy"]            # the SymbolsDistances metrics (v1 and v2)
clip = ["torch", "transformers", "diskcache"]
all = ["signwriting-evaluation[bleu,chrf,similarity,clip]"]
dev = [
    "signwriting-evaluation[all]",
    "pytest",
    "ruff",
    # to plot metric evaluation results
    "matplotlib",
    # to sample words (e.g. names) for text-correlation evaluation
    "Faker",
    # for mouthing G2P (English needs the flite `lex_lookup` binary on PATH)
    "epitran",
]

[tool.yapf]
based_on_style = "google"
column_limit = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle errors/warnings, pyflakes, import sorting

[tool.maturin]
# Mixed Python + Rust package: the pure-Python package lives at the repo root, and the PyO3 kernel
# (signwriting_similarity_rs crate) is compiled into signwriting_evaluation._similarity_rs and shipped
# inside the wheel — so `pip install signwriting-evaluation` includes the fast kernel.
python-source = "."
manifest-path = "signwriting_similarity_rs/Cargo.toml"
module-name = "signwriting_evaluation._similarity_rs"
include = [
    "signwriting_evaluation/metrics/similarity_v2/base_symbol_names.json",
    "signwriting_evaluation/metrics/similarity_v2/similarity_v2.md",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["signwriting_evaluation"]
