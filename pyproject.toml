[project]
name = "signwriting-evaluation"
description = "Automatic Evaluation for SignWriting Machine Learning Outputs"
version = "0.0.1"
authors = [
    { name = "Amit Moryossef", email = "amitmoryossef@gmail.com" }
]
readme = "README.md"
dependencies = [
    # Core: FSW parsing, normalization, mirroring, and rendering — needed by every metric.
    "signwriting>=0.1.9",
]

[project.optional-dependencies]
# Per-metric extras: install only what you use, e.g. `pip install signwriting-evaluation[similarity]`.
bleu = ["sacrebleu"]
chrf = ["sacrebleu"]
# the SymbolsDistances metrics (v1 and v2); the Rust kernel accelerates v2 (falls back to Python if absent)
similarity = ["numpy", "scipy", "signwriting-similarity-rs>=0.1.0"]
clip = ["torch", "transformers", "diskcache"]
all = ["signwriting-evaluation[bleu,chrf,similarity,clip]"]
dev = [
    "signwriting-evaluation[all]",
    "pytest",
    "ruff",
    # to plot metric evaluation results
    "matplotlib",
    # to sample words (e.g. names) for text-correlation evaluation
    "Faker",
    # for mouthing G2P (English needs the flite `lex_lookup` binary on PATH)
    "epitran",
]

[tool.yapf]
based_on_style = "google"
column_limit = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle errors/warnings, pyflakes, import sorting

[tool.setuptools]
packages = [
    "signwriting_evaluation",
    "signwriting_evaluation.metrics",
    "signwriting_evaluation.metrics.bleu",
    "signwriting_evaluation.metrics.chrf",
    "signwriting_evaluation.metrics.clip",
    "signwriting_evaluation.metrics.similarity",
    "signwriting_evaluation.metrics.similarity_v2",
]

[tool.setuptools.package-data]
"signwriting_evaluation.metrics.similarity_v2" = ["base_symbol_names.json", "similarity_v2.md"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["signwriting_evaluation"]
